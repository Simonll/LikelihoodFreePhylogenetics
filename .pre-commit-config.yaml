repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
    -   id: check-yaml
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: https://github.com/bmorcos/pre-commit-hooks-cpp
    rev: master
    hooks:
    -   id: clang-format
    -   id: cpplint
        exclude : '^sources/Random\.cpp$'
        files: '^/BIOINFO/WORKFLOW/SOURCES/LIKELIHOODFREEPHYLOGENETICS/.*'
